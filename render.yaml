# Blueprint de Render para la API NestJS.
# La base de datos PostgreSQL se gestiona en Supabase (fuera de Render).

services:
  - type: web
    name: aplicaciones-web-ii-api
    runtime: node
    plan: free
    branch: deploy-render-supabase
    # Las migraciones se aplicaron manualmente en el SQL Editor de Supabase.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/src/main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PROYECTO5_DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
